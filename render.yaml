# Render Blueprint — one-file IaC for the StudySync backend.
# Deploy: push to GitHub, then Render Dashboard -> New -> Blueprint -> pick this repo.
#
# Free-tier set: API + realtime + managed Postgres + Redis (Key Value).
# The Celery worker has NO free plan on Render (workers are paid-only), so it is
# documented at the bottom — enable it on a paid plan, or run it locally against
# the production DATABASE_URL/REDIS_URL. The worker only powers nightly rollups;
# the live API + realtime demo works fully without it.

databases:
  - name: studysync-db
    plan: free
    databaseName: studysync
    user: studysync

services:
  # --- Redis / Key Value (presence, pub/sub, cache, Celery broker) ---
  - type: keyvalue
    name: studysync-redis
    plan: free
    ipAllowList: []          # internal-only
    maxmemoryPolicy: noeviction

  # --- REST API (FastAPI). Runs migrations on start, then serves. ---
  - type: web
    name: studysync-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    dockerCommand: sh -c "uv run --no-dev alembic upgrade head && uv run --no-dev uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ENVIRONMENT
        value: prod
      - key: LOG_JSON
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false          # set to the frontend origin, e.g. ["https://studysync.vercel.app"]
      - key: DATABASE_URL
        fromDatabase:
          name: studysync-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: studysync-redis
          property: connectionString

  # --- Realtime presence (python-socketio); scale by raising the instance count ---
  - type: web
    name: studysync-realtime
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: sh -c "uv run --no-dev uvicorn app.realtime.asgi:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: prod
      - key: LOG_JSON
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: studysync-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: studysync-redis
          property: connectionString
      - key: JWT_SECRET     # must match the API's secret to validate its tokens
        fromService:
          type: web
          name: studysync-api
          envVarKey: JWT_SECRET

